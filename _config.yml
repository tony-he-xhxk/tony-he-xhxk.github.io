# 站点配置
title: 星河绫
description: 个人主页 · 帖子存档 · 互联网漂流记
lang: zh-CN
timezone: Asia/Shanghai

# 正式域名（已绑定 GitHub Pages，Enforce HTTPS 已开启）
url: "https://xingheling.cn"
baseurl: ""

# 每页展示帖子数
paginate: 10

# 构建配置（GitHub Pages 内置支持 jekyll-sitemap，自动生成 sitemap.xml）
plugins:
  - jekyll-sitemap
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

# 不发布到线上的文件（仅作为仓库内数据源供 GitHub Actions 解析）
exclude:
  - zhuanlan/美式咖啡评测数据.txt
