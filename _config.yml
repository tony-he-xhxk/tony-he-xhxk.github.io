# 站点配置
title: 星河绫
description: 个人主页 · 帖子存档 · 互联网漂流记
lang: zh-CN
timezone: Asia/Shanghai

# 正式域名（已绑定 GitHub Pages，Enforce HTTPS 已开启）
url: "https://xingheling.cn"
baseurl: ""

# 每页展示帖子数
paginate: 10

# 宽屏布局（桌面端容器 1120px，与首页对齐）
# 列在这里的 layout 会自动启用宽容器：帖子详情（post）、关于页（page）、专栏正文（zhuanlan）
# 其他页面想变宽，在自己的 frontmatter 里加 wide: true
wide_layouts:
  - post
  - page
  - zhuanlan
  - ai-column

# GitHub Discussions 评论（giscus）
# 仓库启用 Discussions、安装 giscus App 并创建“专栏评论”分类后，
# 将 giscus.app 配置页生成的 Category ID 填入 giscus.category_id。
giscus:
  repo: "tony-he-xhxk/tony-he-xhxk.github.io"
  repo_id: "R_kgDOT4cNxw"
  category: "专栏评论"
  category_id: "DIC_kwDOT4cNx84DJpuX"
  comment_rules: "友善交流。禁止人身攻击、辱骂、歧视、广告刷屏与泄露隐私；作者保留删除、锁定或隐藏评论的权利。"

# 构建配置（GitHub Pages 内置支持 jekyll-sitemap，自动生成 sitemap.xml）
plugins:
  - jekyll-sitemap
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

# 不发布到线上的文件（仅作为仓库内数据源供 GitHub Actions 解析）
exclude:
  - zhuanlan/美式咖啡横评/美式咖啡评测数据.txt
